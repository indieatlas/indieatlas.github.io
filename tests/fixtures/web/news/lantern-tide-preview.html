<body><article><h1>潮の群島を探索する『Lantern Tide』先行プレイ</h1>
<p>Small Harbor Games が開発する『Lantern Tide』は、灯台守の少女となって、潮の満ち引きで姿を変える群島を探索するアドベンチャーだ。満潮と干潮で道の現れ方が変わり、島の遺跡を少しずつ調べていく。</p>
<p>PC版は2027年春に発売予定で、Switch版も2027年に予定されている。同じ開発元の『Lantern Tide 2』にも少しだけ触れておくと、こちらはまだ情報が少ない。</p>
