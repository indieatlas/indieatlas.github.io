name: update

# 毎日の定期更新と公開（07 §7.2）: research（調査）→ adopt（採用）→ build → deploy。
# 日本時間 8時17分の実行で新しい記事、作品、催し、発売情報を調べて反映する。20時17分の実行は公開だけを行う
# （Amazon の売れ筋は取得から24時間以内のものしか出せないので、12時間ごとに作り直す）
on:
  schedule:
    - cron: '17 23 * * *' # 日本時間 8時17分: full（50分で終わり、OpenCode Go のオフピークに収まる。06 §6.9.3）
    - cron: '17 11 * * *' # 日本時間 20時17分: publish-only
  workflow_dispatch:
    inputs:
      mode:
        description: 'full / collect-only / publish-only'
        type: choice
        options: [full, collect-only, publish-only]
        default: full
      force_deploy:
        description: '公開内容が同じでもデプロイする'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema/**'
      - 'data/**'
      - 'scripts/build/**'
      - 'astro.config.mjs'
      - 'package-lock.json'

concurrency:
  group: site-update-and-publish
  cancel-in-progress: false

permissions: {} # 既定は権限なし。ジョブごとに必要な分だけ付与する

jobs:
  setup:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = push ]; then mode=publish-only
          elif [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '17 11 * * *' ]; then mode=publish-only
          elif [ -n "$INPUT_MODE" ]; then mode="$INPUT_MODE"
          else mode=full; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"

  research:
    needs: setup
    if: ${{ needs.setup.outputs.mode != 'publish-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: research # OPENCODE_API_KEY はこの環境のシークレット（07 §7.9）
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Research
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          INDIEATLAS_LLM_ENABLED: ${{ vars.INDIEATLAS_LLM_ENABLED || 'true' }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_COMMIT: ${{ github.sha }}
        run: npm run research -- --out out/research --mode "${{ needs.setup.outputs.mode }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: research-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/research/
          retention-days: 3
          if-no-files-found: ignore

  adopt:
    needs: [setup, research]
    # 調査ジョブが途中で失敗しても、終わったタスクの結果と費用を保存する（07 §7.7）
    if: ${{ !cancelled() && needs.setup.outputs.mode != 'publish-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      data_commit: ${{ steps.adopt.outputs.data_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: research-${{ github.run_id }}-*
          path: out/research-artifacts/
      - name: Adopt
        id: adopt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_COMMIT: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          git config user.name "indieatlas-bot"
          git config user.email "indieatlas-bot@users.noreply.github.com"
          npm run adopt -- --in out/research-artifacts/ --push

  build:
    needs: [setup, adopt]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.publish_check.outputs.should_deploy }}
      content_hash: ${{ steps.publish_check.outputs.content_hash }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      # 採用ジョブが作ったコミット（なければ起動時のコミット）を1回だけ checkout してビルドする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.adopt.outputs.data_commit || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - name: Fetch Amazon ranking
        # キーがなければ何もしない。失敗しても売れ筋の欄を出さずに公開を続ける
        continue-on-error: true
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION || '3.3' }}
        run: npm run amazon:ranking
      - name: Fetch Steam indie top sellers
        # Amazon の売れ筋がないときに出す。失敗しても公開を続ける
        continue-on-error: true
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: npm run ranking:steam
      - name: Build
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TRIGGER_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run build
      - run: npm run check:dist
      - id: publish_check
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        run: npm run check:publish
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ steps.publish_check.outputs.should_deploy == 'true' }}
        with:
          path: dist/

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
