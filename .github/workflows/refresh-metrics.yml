name: refresh-metrics

# 週に1回、IGDB の機種とスクリーンショット、Steam のレビュー数と評価、IGDB の評価、Steam のレビューの要約、記事へのはてなブックマークの反応の要約を作り直し、
# main に直接コミットしてサイトを公開し直す（06 §6.13.4、§6.13.6、§6.13.7）。要約はコードの検証を通ったものだけが残る。
# キーは環境 research のシークレットに置く
on:
  schedule:
    - cron: '23 21 * * 0' # 毎週月曜 6時23分（日本時間）。毎日の update（8時17分）と重ならないようにする
  workflow_dispatch:

concurrency:
  group: refresh-metrics
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: research
    permissions:
      contents: write
      actions: write # 公開のワークフロー（update.yml）を呼ぶ
    env:
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 新しく登録した作品にも、Steam 以外の機種の発売情報とスクリーンショットを加える（06 §6.13.2）
      - run: npm run igdb:sync -- --by system --run "${{ github.run_id }}"
        continue-on-error: true
      - run: npm run media:palettes
        continue-on-error: true
      - run: npm run metrics:popularity
      # 要約は4週ごとに作り直す（それ以外の週は、まだない作品の分だけ作る）
      - name: Summarize Steam reviews
        run: |
          if [ $(( $(date -u +%V) % 4 )) -eq 0 ]; then npm run reviews:summarize -- --force; else npm run reviews:summarize; fi
      # 掲載から2週間以内の記事の反応を取り直し、新しい記事の分を作る
      - run: npm run reactions:summarize
      - run: npm run check:data
      - name: Commit to main
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "indieatlas-bot"
          git config user.email "indieatlas-bot@users.noreply.github.com"
          git add data
          git commit -m "data: refresh IGDB platforms, popularity metrics, review summaries, and article reactions"
          # 実行中に main が進んでいたら、その上に載せ直す。ぶつかったら失敗させ、次の週に取り直す
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN による push では update.yml の push のトリガーが動かないので、明示的に呼ぶ
      - name: Publish the site
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -R "$GITHUB_REPOSITORY"
